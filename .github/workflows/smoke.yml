name: Smoke Test

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run on emulator and collect logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -partition-size 2048
          script: |
            adb wait-for-device
            sleep 30
            adb install -r app/build/outputs/apk/debug/app-debug.apk || (sleep 20 && adb install -r app/build/outputs/apk/debug/app-debug.apk)
            adb logcat -c
            adb shell am start -W -n com.echofall.game/.MainActivity
            sleep 20
            adb logcat -d -v threadtime > logcat.txt
            echo "===== CRASH / APP LOG ====="
            grep -E "FATAL|AndroidRuntime|echofall|libEGL|GLSurfaceView" logcat.txt | tail -120

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: warn
